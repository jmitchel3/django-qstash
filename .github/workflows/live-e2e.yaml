name: Live e2e

# Round trip against real Upstash QStash: enqueue a task, QStash calls the
# webhook through a temporary Cloudflare quick tunnel, the result is stored.
# Runs on demand, on PRs touching this file, and from CI's release path
# (main.yaml calls it via workflow_call; release needs it to pass).
# Secrets are synced from Doppler (project "dev", config "prd").

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/live-e2e.yaml'
  workflow_call:

env:
  CLOUDFLARED_VERSION: '2026.10.3'
  PORT: '8740'

jobs:
  live-e2e:
    name: Real QStash round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: live-e2e
      cancel-in-progress: false
    defaults:
      run:
        working-directory: sample_project
    env:
      QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
      QSTASH_URL: ${{ secrets.QSTASH_URL }}
      QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.QSTASH_CURRENT_SIGNING_KEY }}
      QSTASH_NEXT_SIGNING_KEY: ${{ secrets.QSTASH_NEXT_SIGNING_KEY }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_QSTASH_WEBHOOK_PATH: /qstash/webhook/
      DJANGO_DEBUG: 'True'
      # The tunnel terminates TLS, so Django sees http while QStash signs https.
      DJANGO_QSTASH_FORCE_HTTPS: 'True'
      # Placeholder for server startup; the smoke step sets the tunnel URL.
      DJANGO_QSTASH_DOMAIN: http://127.0.0.1:8740

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install cloudflared
        timeout-minutes: 3
        working-directory: .
        run: |
          curl -fsSL -o /tmp/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Migrate
        timeout-minutes: 5
        run: uv run python manage.py migrate -v0

      - name: Start Django
        timeout-minutes: 2
        run: |
          nohup uv run python manage.py runserver "127.0.0.1:${PORT}" --noreload \
            > "$RUNNER_TEMP/django.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/admin/login/" && exit 0
            sleep 1
          done
          echo "Django did not start"; cat "$RUNNER_TEMP/django.log"; exit 1

      - name: Start quick tunnel
        id: tunnel
        timeout-minutes: 8
        run: |
          # Quick tunnels are best-effort, so retry with a fresh tunnel.
          start_tunnel() {
            pkill cloudflared || true
            nohup cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:${PORT}" \
              >> "$RUNNER_TEMP/cloudflared.log" 2>&1 &
            local u=""
            for i in $(seq 1 60); do
              u=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | tail -1 || true)
              [ -n "$u" ] && [ "$u" != "$1" ] && break
              u=""
              sleep 1
            done
            [ -n "$u" ] || return 1
            # New quick-tunnel hostnames take a few seconds to resolve publicly.
            for i in $(seq 1 45); do
              curl -fsS -o /dev/null "$u/admin/login/" && { echo "$u"; return 0; }
              sleep 2
            done
            return 1
          }
          url=""; prev=""
          for attempt in 1 2 3; do
            url=$(start_tunnel "$prev") && break
            echo "Tunnel attempt $attempt failed"
            prev=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | tail -1 || true)
            url=""
          done
          [ -n "$url" ] || { echo "No working tunnel"; cat "$RUNNER_TEMP/cloudflared.log"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Tunnel: $url"

      - name: Smoke test
        timeout-minutes: 3
        env:
          DJANGO_QSTASH_DOMAIN: ${{ steps.tunnel.outputs.url }}
        run: uv run python manage.py qstash_smoke_test --timeout 90

      - name: Schedule adoption and recovery smoke test
        timeout-minutes: 3
        env:
          DJANGO_QSTASH_DOMAIN: ${{ steps.tunnel.outputs.url }}
        run: uv run python manage.py qstash_schedule_smoke_test

      - name: Logs
        if: always()
        timeout-minutes: 1
        working-directory: .
        run: |
          echo "::group::django.log"; cat "$RUNNER_TEMP/django.log" || true; echo "::endgroup::"
          echo "::group::cloudflared.log"; cat "$RUNNER_TEMP/cloudflared.log" || true; echo "::endgroup::"
